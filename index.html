<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8fafc;
  --bg-subtle: #f1f5f9;
  --surface: #ffffff;
  --surface-elevated: #ffffff;
  --surface-hover: #f1f5f9;
  --border: rgba(15, 23, 42, 0.06);
  --border-md: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.12);

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #64748b;
  --text-faint: #94a3b8;

  --accent: #10b981;
  --accent-soft: rgba(16, 185, 129, 0.08);
  --accent-medium: rgba(16, 185, 129, 0.16);
  --accent-text: #047857;
  --accent-dim: #065f46;

  /* Type colors - refined for light mode */
  --violet-bg: rgba(139, 92, 246, 0.08);
  --violet-text: #6d28d9;
  --violet-border: rgba(139, 92, 246, 0.15);
  --violet-dot: #8b5cf6;

  --blue-bg: rgba(59, 130, 246, 0.08);
  --blue-text: #1d4ed8;
  --blue-border: rgba(59, 130, 246, 0.15);
  --blue-dot: #3b82f6;

  --teal-bg: rgba(20, 184, 166, 0.08);
  --teal-text: #0f766e;
  --teal-border: rgba(20, 184, 166, 0.15);
  --teal-dot: #14b8a6;

  --amber-bg: rgba(245, 158, 11, 0.08);
  --amber-text: #b45309;
  --amber-border: rgba(245, 158, 11, 0.15);
  --amber-dot: #f59e0b;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 100px;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.02);
  --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
  --shadow-glow: 0 0 40px rgba(16, 185, 129, 0.05);

  /* Typography Scale */
  --font-xs: 12px;
  --font-sm: 13px;
  --font-base: 15px;
  --font-md: 16px;
  --font-lg: 18px;
  --font-xl: 20px;
  --font-2xl: 36px;
}

body {
  font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100dvh;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── App Shell ── */
.app {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  gap: 0;
  align-items: flex-start;
  min-height: 100dvh;
}

/* ── Sidebar ── */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100dvh;
  padding: 28px 20px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-hover) transparent;
}

/* ── Page Header ── */
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.page-icon {
  width: 44px;
  height: 44px;
  background: var(--accent-soft);
  border: 1px solid rgba(16,185,129,0.15);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-xl);
  flex-shrink: 0;
}
.page-title {
  font-size: var(--font-xl);
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.page-sub {
  font-size: var(--font-sm);
  color: var(--text-tertiary);
  margin-top: 2px;
  letter-spacing: 0.01em;
}

/* ── Stats ── */
.stats-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 14px 16px 12px;
  transition: border-color 0.2s, background 0.2s;
}
.stat-card:hover {
  border-color: var(--border-md);
  background: var(--surface-elevated);
}
.stat-label {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
  font-weight: 500;
  text-transform: uppercase;
}
.stat-val {
  font-size: var(--font-2xl);
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1;
  letter-spacing: -0.02em;
}
.stat-val .stat-unit {
  font-size: var(--font-sm);
  font-weight: 500;
  color: var(--text-tertiary);
  margin-left: 2px;
}
.stat-val-sm {
  font-size: var(--font-base);
  font-weight: 600;
  color: var(--accent-text);
  padding-top: 2px;
  line-height: 1.4;
}
.stats-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

/* ── Section Labels ── */
.section-label {
  font-size: var(--font-xs);
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 2px 0;
}

/* ── Filter Chips ── */
.filter-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.filter-chip {
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--font-base);
  font-family: inherit;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.filter-chip:hover:not(.active) {
  background: var(--surface);
  color: var(--text-primary);
}
.filter-chip.active {
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 500;
}

.chip-count {
  font-size: var(--font-xs);
  color: var(--text-faint);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 18px;
  text-align: right;
}
.filter-chip.active .chip-count {
  color: var(--accent-dim);
}

.chip-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Sidebar Actions ── */
.sidebar-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.sidebar-btn {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--font-base);
  font-family: inherit;
  border: 1px solid var(--border-md);
  background: var(--surface);
  cursor: pointer;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s ease;
}
.sidebar-btn:hover {
  background: var(--surface-elevated);
  color: var(--text-primary);
  border-color: var(--border-strong);
}
.sidebar-btn.primary {
  background: var(--accent-soft);
  border-color: rgba(16,185,129,0.18);
  color: var(--accent-text);
  font-weight: 500;
}
.sidebar-btn.primary:hover {
  background: var(--accent-medium);
  border-color: rgba(16,185,129,0.30);
}
.sidebar-btn.primary:active {
  transform: scale(0.98);
}
.sidebar-btn-icon {
  font-size: var(--font-md);
  line-height: 1;
}
.sidebar-btn .kbd {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  background: rgba(15, 23, 42, 0.04);
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-family: system-ui, monospace;
  margin-left: auto;
}

/* ── Main Content ── */
.main-content {
  flex: 1;
  min-width: 0;
  padding: 28px 24px 48px 28px;
}

/* ── Week Nav ── */
.week-nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  background: rgba(248, 250, 252, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}
.week-label {
  font-size: var(--font-md);
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
  text-align: center;
  letter-spacing: -0.01em;
}
.nav-btn {
  background: var(--surface);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: var(--font-lg);
  color: var(--text-secondary);
  transition: all 0.15s ease;
}
.nav-btn:hover {
  background: var(--surface-elevated);
  color: var(--text-primary);
  border-color: var(--border-strong);
}
.nav-btn:active {
  transform: scale(0.95);
}

/* ── Entry Cards ── */
.entry-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.entry-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  animation: cardIn 0.35s ease both;
}
.entry-card:hover {
  border-color: var(--border-md);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.entry-card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--border);
}

.type-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-yanyu { background: var(--violet-dot); box-shadow: 0 0 6px rgba(139,92,246,0.3); }
.dot-shuliang { background: var(--blue-dot); box-shadow: 0 0 6px rgba(59,130,246,0.3); }
.dot-panduan { background: var(--teal-dot); box-shadow: 0 0 6px rgba(20,184,166,0.3); }
.dot-zicheng { background: var(--amber-dot); box-shadow: 0 0 6px rgba(245,158,11,0.3); }

.type-badge {
  font-size: var(--font-xs);
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-weight: 500;
  letter-spacing: 0.02em;
}
.tb-yanyu { background: var(--violet-bg); color: var(--violet-text); }
.tb-shuliang { background: var(--blue-bg); color: var(--blue-text); }
.tb-panduan { background: var(--teal-bg); color: var(--teal-text); }
.tb-zicheng { background: var(--amber-bg); color: var(--amber-text); }

.subtype-badge {
  font-size: var(--font-xs);
  color: var(--text-tertiary);
  background: rgba(15, 23, 42, 0.04);
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
}

.entry-date {
  font-size: var(--font-xs);
  color: var(--text-faint);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

.entry-del {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-faint);
  font-size: var(--font-md);
  padding: 4px;
  line-height: 1;
  border-radius: 4px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.entry-del:hover {
  color: #f87171;
  background: rgba(248,113,113,0.10);
}

.entry-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.entry-section {
  padding: 12px 16px 14px;
}
.entry-section:first-child {
  border-right: 1px solid var(--border);
}
.entry-section-label {
  font-size: var(--font-xs);
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.entry-section-val {
  font-size: var(--font-base);
  color: var(--text-secondary);
  line-height: 1.65;
}
.entry-section-val.rule {
  color: var(--accent-text);
  font-weight: 500;
}

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
  font-size: var(--font-base);
}
.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: var(--font-xl);
}
.empty-text {
  color: var(--text-tertiary);
  line-height: 1.5;
}

/* ── Modal ── */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.3);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.open {
  display: flex;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal {
  background: var(--surface-elevated);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 100%;
  max-width: 600px;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.25s ease both;
}
.modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.modal-icon {
  width: 36px;
  height: 36px;
  background: var(--accent-soft);
  border: 1px solid rgba(16,185,129,0.15);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-lg);
  flex-shrink: 0;
}
.modal-title {
  font-size: var(--font-lg);
  font-weight: 700;
  letter-spacing: -0.01em;
}
.modal-close {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: var(--font-xl);
  padding: 4px;
  border-radius: 4px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-close:hover {
  color: var(--text-secondary);
  background: rgba(15, 23, 42, 0.05);
}

.form-group { margin-bottom: 16px; }
.form-label {
  font-size: var(--font-sm);
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  display: block;
  letter-spacing: 0.02em;
}
.form-label .optional {
  color: var(--text-faint);
  font-weight: 400;
}
.form-row-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-row-2col .form-group { margin-bottom: 0; }

/* Type Selector */
.type-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.type-opt {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-md);
  background: var(--surface);
  cursor: pointer;
  font-size: var(--font-base);
  font-family: inherit;
  color: var(--text-secondary);
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}
.type-opt.selected {
  border-color: rgba(16,185,129,0.25);
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 500;
}
.type-opt:hover:not(.selected) {
  background: var(--surface-hover);
  color: var(--text-primary);
}
.type-opt:active {
  transform: scale(0.98);
}
.type-dot-sm {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Inputs */
input[type="text"], textarea {
  width: 100%;
  font-size: var(--font-base);
  font-family: inherit;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  resize: vertical;
  background: var(--surface);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  line-height: 1.6;
}
textarea { min-height: 72px; }
input[type="text"]:focus, textarea:focus {
  border-color: rgba(16,185,129,0.35);
  box-shadow: 0 0 0 3px rgba(16,185,129,0.08);
}
input[type="text"]::placeholder, textarea::placeholder {
  color: var(--text-faint);
}

/* Modal Actions */
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  align-items: center;
}
.modal-hint {
  font-size: var(--font-xs);
  color: var(--text-faint);
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-hint kbd {
  font-size: var(--font-xs);
  background: rgba(15, 23, 42, 0.04);
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-family: system-ui, monospace;
}
.btn-cancel {
  background: var(--surface);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  padding: 8px 18px;
  font-size: var(--font-base);
  font-family: inherit;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s;
}
.btn-cancel:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}
.btn-save {
  background: var(--accent);
  border: 1px solid rgba(16,185,129,0.2);
  border-radius: var(--radius-sm);
  padding: 8px 20px;
  font-size: var(--font-base);
  font-family: inherit;
  cursor: pointer;
  color: #ffffff;
  font-weight: 600;
  transition: all 0.15s;
}
.btn-save:hover {
  background: #059669;
}
.btn-save:active {
  transform: scale(0.98);
}

/* ── Toast ── */
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(12px); }
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-elevated);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: var(--font-base);
  color: var(--accent-text);
  box-shadow: var(--shadow-lg);
  z-index: 200;
  animation: toastIn 0.25s ease;
  pointer-events: none;
}
.toast.hiding {
  animation: toastOut 0.2s ease forwards;
}

/* ── Scrollbar ── */
.main-content::-webkit-scrollbar,
.sidebar::-webkit-scrollbar {
  width: 4px;
}
.main-content::-webkit-scrollbar-track,
.sidebar::-webkit-scrollbar-track {
  background: transparent;
}
.main-content::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb {
  background: var(--surface-hover);
  border-radius: 4px;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .app {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 20px 16px;
    gap: 14px;
  }
  .stats-pair {
    grid-template-columns: 1fr 1fr;
  }
  .main-content {
    padding: 16px 16px 48px;
  }
  .entry-body {
    grid-template-columns: 1fr;
  }
  .entry-section:first-child {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .form-row-2col {
    grid-template-columns: 1fr;
  }
  .modal {
    max-width: 100%;
    margin: auto 8px;
  }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .entry-card { animation: none; }
  .modal { animation: none; }
  .toast { animation: none; }
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
  }
}

/* ── Import Modal Stats ── */
.import-summary-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}
.import-stat-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  font-size: var(--font-base);
}
.import-stat-label {
  color: var(--text-secondary);
  font-weight: 500;
}
.import-stat-value {
  color: var(--text-primary);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.import-stat-value.highlight {
  color: var(--accent-text);
}
.import-stat-value.warning {
  color: #f59e0b;
}
.import-notice {
  font-size: var(--font-sm);
  color: #b45309;
  line-height: 1.5;
  padding: 10px 12px;
  background: rgba(245, 158, 11, 0.06);
  border: 1px solid rgba(245, 158, 11, 0.12);
  border-radius: var(--radius-sm);
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.import-notice svg {
  flex-shrink: 0;
  margin-top: 2px;
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="page-header">
      <div class="page-icon">
        <svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" fill="#d1fae5"/><rect x="4" y="2" width="4" height="20" fill="#10b981"/><path d="M16 2v5l1.5-1.2L19 7V2" fill="#059669"/><line x1="11" y1="8" x2="18" y2="8" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/><line x1="11" y1="11.5" x2="18" y2="11.5" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/><line x1="11" y1="15" x2="15.5" y2="15" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>

        <div class="page-title">错题本</div>

    <div class="stats-row">

      <button class="filter-chip" onclick="setFilter(this,'言语理解')">

      <button class="filter-chip" onclick="setFilter(this,'数量关系')">
        <span style="display:flex;align-items:center;gap:8px;"><span class="chip-dot" style="background:var(--blue-dot)"></span>数量关系</span>
        <span class="chip-count" id="count-shuliang">0</span>

    <div class="sidebar-actions">

        <span class="sidebar-btn-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><line x1="12" y1="12" x2="12" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>

      </button>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="sidebar-btn" onclick="exportData()" id="export-btn" style="padding: 10px 6px;">
          <span class="sidebar-btn-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="18" height="8" rx="2" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.8"/><polyline points="8 8 12 3 16 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          导出数据
        </button>
        <button class="sidebar-btn" onclick="triggerImport()" id="import-btn" style="padding: 10px 6px;">
          <span class="sidebar-btn-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="18" height="8" rx="2" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.8"/><polyline points="8 8 12 13 16 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="2" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          导入数据
        </button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)" aria-label="上一周">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M15 5L8 12l7 7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="nav-btn" onclick="changeWeek(1)" aria-label="下一周">

</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="14" height="19" rx="2" fill="#d1fae5"/><line x1="6" y1="8" x2="12" y2="8" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/><line x1="6" y1="11.5" x2="10" y2="11.5" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/><path d="M18.5 2.5l3 3-8.5 8.5-4 1 1-4 8.5-8.5z" fill="#10b981"/><path d="M16 5l3 3" stroke="#059669" stroke-width="1.2"/></svg>
      </div>
      <div class="modal-title">记录错题</div>
      <button class="modal-close" onclick="closeModal()" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.06"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

        <button class="type-opt" data-val="数量关系" onclick="selectType(this)">

        </button>
        <button class="type-opt" data-val="判断推理" onclick="selectType(this)">

      </div>

        <label class="form-label" for="f-rule">正确规律总结</label>

<!-- Import File Input -->
<input type="file" id="import-file-input" style="display: none;" accept=".json" onchange="handleImport(event)">

<!-- Import Confirmation Modal -->
<div class="modal-backdrop" id="import-modal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-icon" style="background: var(--violet-bg); border-color: rgba(139,92,246,0.15)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="18" height="8" rx="2" fill="var(--violet-bg)" stroke="var(--violet-text)" stroke-width="1.5"/><polyline points="8 8 12 13 16 8" fill="none" stroke="var(--violet-text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="2" x2="12" y2="13" stroke="var(--violet-text)" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
      <div class="modal-title">导入错题数据</div>
      <button class="modal-close" onclick="closeImportModal()" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.06"/><line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="import-stats" id="import-stats-content">
      <!-- Filled dynamically by JavaScript -->
    </div>

    <div class="modal-actions" style="margin-top: 24px;">
      <button class="btn-cancel" onclick="closeImportModal()">取消</button>
      <button class="btn-save" id="btn-merge-import" onclick="confirmImport('merge')" style="background: var(--accent); border-color: rgba(16,185,129,0.2);">增量合并 (保留现有)</button>
      <button class="btn-save" id="btn-replace-import" onclick="confirmImport('replace')" style="background: #ef4444; border-color: rgba(239,68,68,0.2);">完全覆盖</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gk-wrong-entries-v1';
let entries = [];
let weekOffset = 0;
let activeFilter = 'all';
let selectedType = '言语理解';

function getWeekKey(date) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0,10);
}
function getWeekRange(offset) {
  const now = new Date();
  now.setDate(now.getDate() + offset * 7);
  const day = now.getDay() || 7;
  const mon = new Date(now); mon.setDate(now.getDate() - day + 1);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { mon, sun, key: mon.toISOString().slice(0,10) };
}
function fmtDate(d) {
  const dt = new Date(d);
  return (dt.getMonth()+1) + '/' + dt.getDate();
}
function fmtWeekLabel(offset, mon, sun) {
  const range = fmtDate(mon) + ' \u2013 ' + fmtDate(sun);
  if (offset === 0) return '\u672C\u5468\uFF08' + range + '\uFF09';
  if (offset === -1) return '\u4E0A\u5468\uFF08' + range + '\uFF09';
  return range;
}
function typeClass(t) {
  if (t === '言语理解') return 'tb-yanyu';
  if (t === '数量关系') return 'tb-shuliang';
  if (t === '判断推理') return 'tb-panduan';
  return 'tb-zicheng';
}
function dotClass(t) {
  if (t === '言语理解') return 'dot-yanyu';
  if (t === '数量关系') return 'dot-shuliang';
  if (t === '判断推理') return 'dot-panduan';
  return 'dot-zicheng';
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('hiding'); }, 1800);
  setTimeout(() => { el.remove(); }, 2100);
}

function exportData() {
  if (entries.length === 0) { showToast('暂无错题数据'); return; }
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '错题本_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已导出 ' + entries.length + ' 条记录');
}

let parsedImportEntries = [];

function triggerImport() {
  document.getElementById('import-file-input').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) {
        showToast('导入失败：数据必须是一个 JSON 数组');
        event.target.value = '';
        return;
      }
      
      // Basic validation of fields
      const isValid = data.every(item => item && typeof item === 'object');
      if (!isValid && data.length > 0) {
        showToast('导入失败：JSON 数据格式不正确');
        event.target.value = '';
        return;
      }
      
      parsedImportEntries = data;
      showImportConfirmation(file.name);
    } catch (err) {
      showToast('导入失败：非法的 JSON 文件');
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

function showImportConfirmation(fileName) {
  const total = parsedImportEntries.length;
  const existingIds = new Set(entries.map(e => e.id));
  
  let newCount = 0;
  let dupCount = 0;
  
  parsedImportEntries.forEach(item => {
    if (item.id && existingIds.has(item.id)) {
      dupCount++;
    } else {
      newCount++;
    }
  });
  
  const container = document.getElementById('import-stats-content');
  container.innerHTML = `
    <div class="import-summary-list">
      <div class="import-stat-item">
        <span class="import-stat-label">导入文件名</span>
        <span class="import-stat-value" style="word-break: break-all; max-width: 60%; text-align: right;">${fileName}</span>
      </div>
      <div class="import-stat-item">
        <span class="import-stat-label">包含错题数</span>
        <span class="import-stat-value">${total} 条</span>
      </div>
      <div class="import-stat-item">
        <span class="import-stat-label">待新增记录</span>
        <span class="import-stat-value highlight">${newCount} 条</span>
      </div>
      <div class="import-stat-item">
        <span class="import-stat-label">待更新/重复记录</span>
        <span class="import-stat-value ${dupCount > 0 ? 'warning' : ''}">${dupCount} 条</span>
      </div>
    </div>
    ${dupCount > 0 ? `
      <div class="import-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><line x1="12" y1="9" x2="12" y2="13" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="#b45309"/></svg>
        <div>有 ${dupCount} 条记录与本地 ID 冲突。你可以选择：【增量合并】会用导入数据更新/覆盖同 ID 的记录；【完全覆盖】则会丢弃本地所有数据。</div>
      </div>
    ` : ''}
  `;
  
  document.getElementById('import-modal').classList.add('open');
}

function closeImportModal() {
  document.getElementById('import-modal').classList.remove('open');
  document.getElementById('import-file-input').value = '';
  parsedImportEntries = [];
}

function confirmImport(mode) {
  if (!parsedImportEntries || parsedImportEntries.length === 0) return;
  
  if (mode === 'replace') {
    entries = [...parsedImportEntries];
  } else if (mode === 'merge') {
    const entryMap = new Map();
    // Load current
    entries.forEach(e => entryMap.set(e.id, e));
    // Merge new/updates
    parsedImportEntries.forEach(item => {
      const id = item.id || Date.now().toString() + Math.random().toString(36).substr(2, 5);
      entryMap.set(id, {
        id,
        type: item.type || '言语理解',
        subtype: item.subtype || '',
        reason: item.reason || '',
        rule: item.rule || '',
        date: item.date || new Date().toISOString()
      });
    });
    entries = Array.from(entryMap.values());
  }
  
  saveAll();
  closeImportModal();
  weekOffset = 0;
  render();
  showToast('导入成功，当前累计共 ' + entries.length + ' 条记录');
}

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch(e) { entries = []; }
  render();
}
function saveAll() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
}

function render() {
  const { mon, sun, key } = getWeekRange(weekOffset);
  document.getElementById('week-label').textContent = fmtWeekLabel(weekOffset, mon, sun);
  const weekEntries = entries.filter(e => getWeekKey(e.date) === key);
  const filtered = activeFilter === 'all' ? weekEntries : weekEntries.filter(e => e.type === activeFilter);
  document.getElementById('stat-week').textContent = weekEntries.length;
  document.getElementById('stat-total').textContent = entries.length;
  const typeCounts = {};
  entries.forEach(e => { typeCounts[e.type] = (typeCounts[e.type]||0)+1; });
  document.getElementById('count-all').textContent = entries.length;
  document.getElementById('count-yanyu').textContent = typeCounts['言语理解'] || 0;
  document.getElementById('count-shuliang').textContent = typeCounts['数量关系'] || 0;
  document.getElementById('count-panduan').textContent = typeCounts['判断推理'] || 0;
  document.getElementById('count-zicheng').textContent = typeCounts['资料分析'] || 0;
  const topType = Object.entries(typeCounts).sort((a,b) => b[1]-a[1])[0];
  document.getElementById('stat-top').textContent = topType ? topType[0] : '-';

  const list = document.getElementById('entry-list');
  if (filtered.length === 0) {
    const label = activeFilter === 'all' ? '' : '\u300C' + activeFilter + '\u300D\u7684';
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="color:var(--text-faint)"><rect x="4" y="2" width="16" height="20" rx="2" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="2" width="4" height="20" fill="currentColor" fill-opacity="0.08"/><line x1="11" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3"/><line x1="11" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3"/><line x1="11" y1="16" x2="15" y2="16" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3"/></svg>
        </div>
        <div class="empty-text">这周没有${label}错题记录</div>
      </div>`;
    return;
  }
  list.innerHTML = filtered.slice().reverse().map((e, i) => `
    <div class="entry-card" style="animation-delay:${i * 0.04}s">
      <div class="entry-card-top">
        <span class="type-dot ${dotClass(e.type)}"></span>
        <span class="type-badge ${typeClass(e.type)}">${e.type}</span>
        ${e.subtype ? `<span class="subtype-badge">${e.subtype}</span>` : ''}
        <span class="entry-date">${fmtDate(e.date)}</span>
        <button class="entry-del" onclick="deleteEntry('${e.id}')" aria-label="删除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.8"/><path d="M5 6l1.5 14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2L19 6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.8"/><line x1="10" y1="10" x2="10" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="14" y1="10" x2="14" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="entry-body">
        <div class="entry-section">
          <div class="entry-section-label">错误原因</div>
          <div class="entry-section-val">${e.reason || '-'}</div>
        </div>
        <div class="entry-section">
          <div class="entry-section-label">正确规律</div>
          <div class="entry-section-val rule">${e.rule || '-'}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function changeWeek(dir) {
  weekOffset += dir;
  if (weekOffset > 0) weekOffset = 0;
  render();
}
function setFilter(el, type) {
  activeFilter = type;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}
function selectType(el) {
  selectedType = el.dataset.val;
  document.querySelectorAll('.type-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}
function openModal() {
  document.getElementById('f-reason').value = '';
  document.getElementById('f-rule').value = '';
  document.getElementById('f-subtype').value = '';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('f-subtype').focus(), 100);
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function saveEntry() {
  const reason = document.getElementById('f-reason').value.trim();
  const rule = document.getElementById('f-rule').value.trim();
  const subtype = document.getElementById('f-subtype').value.trim();
  if (!reason && !rule) { showToast('请至少填写一项内容'); return; }
  const entry = { id: Date.now().toString(), type: selectedType, subtype, reason, rule, date: new Date().toISOString() };
  entries.push(entry);
  saveAll();
  closeModal();
  weekOffset = 0;
  render();
  showToast('已添加 1 条错题记录');
}
function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveAll();
  render();
  showToast('已删除记录');
}

// Click backdrop to close
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('import-modal').addEventListener('click', function(e) {
  if (e.target === this) closeImportModal();
});

document.addEventListener('keydown', function(e) {
  const isInput = ['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName);
  if (e.key === 'n' && !isInput) {
    e.preventDefault();
    openModal();
  }
  if (e.key === 'Escape') {
    closeModal();
    closeImportModal();
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    saveEntry();
  }
});

loadEntries();
</script>
</body>
</html>
